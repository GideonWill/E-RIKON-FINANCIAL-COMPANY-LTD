<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Apple iOS "Save to Home Screen" Web App Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Web App Meta Capabilities -->
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E-RiKON" />
    <meta name="application-name" content="E-RiKON" />
    <meta name="msapplication-TileColor" content="#f97316" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
  <body class="bg-[#f8fafc] text-slate-900 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root">
      <!-- Pure White Splash Screen for Mobile & Web App Boot -->
      <div id="erikon-pre-splash" style="position:fixed;inset:0;background-color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Plus Jakarta Sans',sans-serif;padding:24px;">
        <img src="/logo.png" alt="E-RiKON Financial Company PLC" style="width:260px;max-width:85vw;height:auto;object-fit:contain;" />
        <div style="margin-top:24px;width:160px;height:4px;background:#f1f5f9;border-radius:999px;overflow:hidden;">
          <div style="width:65%;height:100%;background:linear-gradient(90deg,#0d9488,#166534);border-radius:999px;"></div>
        </div>
        <div style="font-size:11px;font-weight:600;color:#94a3b8;font-family:monospace;margin-top:10px;">ECFMS v2.0</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
