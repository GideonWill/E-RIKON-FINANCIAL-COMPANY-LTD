<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />

    <!-- Apple iOS "Save to Home Screen" Web App Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Web App Meta Capabilities -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E-RIKON" />
    <meta name="application-name" content="E-RIKON" />
    <meta name="msapplication-TileColor" content="#020617" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root">
      <!-- Pure White Splash Screen for Mobile & Web App Boot -->
      <div id="erikon-pre-splash" style="position:fixed;inset:0;background-color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Plus Jakarta Sans',sans-serif;padding:24px;">
        <div style="background:#ffffff;padding:16px;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,0.06);border:1px solid #f1f5f9;margin-bottom:20px;">
          <img src="/logo.jpeg" alt="E-RIKON Group" style="width:110px;height:110px;object-fit:contain;border-radius:16px;" />
        </div>
        <div style="font-size:24px;font-weight:900;color:#020617;letter-spacing:-0.5px;">E-RIKON <span style="color:#f59e0b;">GROUP</span></div>
        <div style="font-size:12px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:1px;margin-top:4px;">Financial Company Ltd</div>
        <div style="margin-top:24px;width:160px;height:4px;background:#f1f5f9;border-radius:999px;overflow:hidden;">
          <div style="width:60%;height:100%;background:linear-gradient(90deg,#f59e0b,#10b981);border-radius:999px;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
