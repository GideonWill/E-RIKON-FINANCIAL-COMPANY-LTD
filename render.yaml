services:
  - type: web
    name: e-rikon-ecfms-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: erikon-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: erikon-db
    plan: free
    databaseName: erikondb
    user: erikon_admin
